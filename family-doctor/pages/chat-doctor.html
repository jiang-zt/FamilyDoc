<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>家庭医生</title>
    <link rel="stylesheet" href="../../css/doctor/doctor.css">
</head>
<body>
    <div class="chat-container" id="doctorPage">
        <div class="chat-header">
            家庭医生 <block v-if="currentUserName != null">正在和<strong style="color: rgb(4, 6, 6);">{{currentUserName}}</strong>沟通中</block>
            <div class="user-input-container" v-if="currentUserName == null">
                <input type="text" id="login-username" placeholder="用户名" class="user-input-field"/>
                <input type="password" id="login-password" placeholder="密码" class="user-input-field"/>
                <button class="submit-button" @click="doLogin()">登录</button>
                <button class="submit-button" @click="doRegister()">注册</button>
                <div class="login-error" v-if="loginError">{{loginError}}</div>
            </div>
            <div class="user-input-container" v-else>
                <button class="submit-button" @click="doLogout()">退出登录</button>
            </div>
        </div>
        <div class="chat-messages" id="chat-messages">
            
            <block v-for="(item, index) in chatList">
                <div class="message user" v-if="item.chatType === 'user'">
                    <div class="text">{{ item.content }}</div>
                    <div class="user-avatar">我</div>
                </div>
               <div class="message bot" v-else>
                    <div class="avatar">
                        <img class="avatar-img" src="../../img/doctor-avatar.png" alt="doctor">
                    </div>
                    <div class="text" v-html="item.content"></div>
                </div>
            </block>

        </div>
        <div class="chat-input">
            <input type="text" id="user-input" value="" placeholder="请输入内容..." @keydown="handleKeyDown(event)">
            <button id="btn-chat" @click="doChat()">发送</button>
            <button id="btn-clear" @click="clearChatRecords()">清空记录</button>
        </div>
    </div>

</body>

<script src="../../libs/vue.min.js"></script>
<script src="../../libs/axios.min.js"></script>
<script src="../../libs/jquery-3.4.1.min.js"></script>
<script src="../../libs/js.cookie.min.js"></script>
<script src="../../js/app.js"></script>

<script src="../../libs/marked.min.js"></script>

<script src="../../js/cookieUtils.js"></script>
<script src="../../js/request.js"></script>
<script src="../../js/apis/admin/authApi.js"></script>
<script src="../../js/apis/admin/doctorApi.js"></script>

<script>

	var doctorPage = new Vue({
		el: "#doctorPage",
		components: {
			// 'my-component': httpVueLoader('my-component.vue')
        },
		data() {
			return {
				botMsgId: null,
                currentUserName: null,
                chatList: [],
                loginError: null,
                sseSource: null,
                sseReconnectTimer: null,
                sseReconnectAttempts: 0,
                sseManualClose: false,
                sseReconnectBaseDelayMs: 1000,
                sseReconnectMaxDelayMs: 15000,
                beforeUnloadHandler: null,
			}
		},
		created() { 
            this.beforeUnloadHandler = () => {
                this.destroySSEConnection();
            };
		},
		mounted() {
            this.tryAutoLogin();
            this.scrollToBottom();
            window.addEventListener('beforeunload', this.beforeUnloadHandler);
        },
        beforeDestroy() {
            this.destroySSEConnection();
            if (this.beforeUnloadHandler) {
                window.removeEventListener('beforeunload', this.beforeUnloadHandler);
            }
        },
		watch: {
		},
		methods: {
            initSSE(userName) {
                var me = this;

                if (window.EventSource) {
                    me.currentUserName = userName;
                    me.sseManualClose = false;
                    me.sseReconnectAttempts = 0;
                    me.clearSSEReconnectTimer();
                    me.connectSSE(userName);
                } else {
                    console.log("浏览器不支持SSE");
                }
            },
            connectSSE(userName) {
                var me = this;
                var token = cookieUtils.getToken();
                if (!token || !userName) {
                    return;
                }
                me.closeSSEConnection(false);

                var sseUrl = window.appConfig.backendBaseURL + '/sse/connect?userId=' + userName + '&token=' + token;
                var source = new EventSource(sseUrl);
                me.sseSource = source;
                console.log("连接用户=" + userName);
                
                source.addEventListener('open', function () {
                    console.log("建立连接。。。");
                    me.sseReconnectAttempts = 0;
                }, false);

                source.addEventListener('add', function (e) {

                    console.log("add事件...");
                    console.log(e.data);
                    var receiveMsg = e.data;

                    var botMsgId = me.botMsgId;
                    if (botMsgId == null || botMsgId == '') {
                        botMsgId = me.generateRandomId(12);
                        me.botMsgId = botMsgId;
                        console.log("botMsgId = " + botMsgId);

                        // 为空，创建新对象
                        var newBotContent = {
                            id: "temp",
                            content: receiveMsg,
                            // time: '2023-05-01 12:00:00',
                            userName: '家庭医生',
                            chatType: 'bot',
                            botMsgId: botMsgId,
                        };
                        me.chatList.push(newBotContent);

                    } else {
                        console.log("botMsgId 不为空...");
                        console.log("botMsgId = " + botMsgId);

                        // 不为空，找到对应的聊天记录流式插入数据
                        for (var i = 0; i < me.chatList.length; i++) {
                            var chatItem = me.chatList[i];
                            if (chatItem.botMsgId == botMsgId) {
                                // 找到对应的聊天记录流式插入数据
                                chatItem.content += receiveMsg;
                            }
                        }
                    }

                    me.scrollToBottom();
                });

                source.addEventListener('finish', function () {
                    console.log("finish事件...");
                    me.botMsgId = null;
                    me.scrollToBottom();
                });

                source.addEventListener('error', function () {
                    if (me.sseSource !== source) {
                        return;
                    }
                    console.log("error事件，准备重连...");
                    me.closeSSEConnection(false);
                    me.scheduleSSEReconnect(userName);
                });

                source.addEventListener("customEvent", function(e) {
                    console.log(e.lastEventId);
                    console.log(e.data);
                }, false);
            },
            scheduleSSEReconnect(userName) {
                if (this.sseManualClose) {
                    return;
                }
                var token = cookieUtils.getToken();
                if (!token || !this.currentUserName || this.currentUserName !== userName) {
                    return;
                }
                this.clearSSEReconnectTimer();
                var delay = Math.min(
                    this.sseReconnectBaseDelayMs * Math.pow(2, this.sseReconnectAttempts),
                    this.sseReconnectMaxDelayMs
                );
                this.sseReconnectAttempts += 1;
                console.log("SSE将在 " + delay + "ms 后重连，第 " + this.sseReconnectAttempts + " 次尝试");
                this.sseReconnectTimer = setTimeout(() => {
                    if (this.sseManualClose) {
                        return;
                    }
                    this.connectSSE(userName);
                }, delay);
            },
            clearSSEReconnectTimer() {
                if (this.sseReconnectTimer) {
                    clearTimeout(this.sseReconnectTimer);
                    this.sseReconnectTimer = null;
                }
            },
            closeSSEConnection(manualClose) {
                if (manualClose) {
                    this.sseManualClose = true;
                }
                this.clearSSEReconnectTimer();
                if (this.sseSource) {
                    try {
                        this.sseSource.close();
                    } catch (e) {}
                    this.sseSource = null;
                }
            },
            destroySSEConnection() {
                this.closeSSEConnection(true);
            },

            tryAutoLogin() {
                var userInfo = cookieUtils.getUserInfo();
                var token = cookieUtils.getToken();
                if (!userInfo || !token) {
                    return;
                }

                authApi.me().then((result) => {
                    this.currentUserName = result.username;
                    this.initSSE(this.currentUserName);
                    this.getChatRecords();
                }).catch((err) => {
                    this.destroySSEConnection();
                    cookieUtils.removeUserInfo();
                    cookieUtils.removeToken();
                });
            },

            doLogin() {
                this.loginError = null;
                const username = document.getElementById('login-username').value;
                const password = document.getElementById('login-password').value;
                if (username.trim() === '' || password.trim() === '') {
                    this.loginError = '请输入用户名和密码';
                    return;
                }

                authApi.login({username: username.trim(), password: password.trim()}).then((result) => {
                    this.destroySSEConnection();
                    cookieUtils.setToken(result.token);
                    cookieUtils.setUserInfo(result.user);
                    this.currentUserName = result.user.username;
                    this.initSSE(this.currentUserName);
                    this.getChatRecords();
                }).catch((err) => {
                    this.loginError = '登录失败，请检查用户名或密码';
                });
            },

            doRegister() {
                this.loginError = null;
                const username = document.getElementById('login-username').value;
                const password = document.getElementById('login-password').value;
                if (username.trim() === '' || password.trim() === '') {
                    this.loginError = '请输入用户名和密码';
                    return;
                }
                authApi.register({username: username.trim(), password: password.trim()}).then((result) => {
                    this.destroySSEConnection();
                    cookieUtils.setToken(result.token);
                    cookieUtils.setUserInfo(result.user);
                    this.currentUserName = result.user.username;
                    this.initSSE(this.currentUserName);
                    this.getChatRecords();
                }).catch((err) => {
                    this.loginError = '注册失败，用户名可能已存在';
                });
            },

            doLogout() {
                this.destroySSEConnection();
                cookieUtils.removeUserInfo();
                cookieUtils.removeToken();
                this.currentUserName = null;
                this.chatList = [];
                window.location.href = '/pages/entry.html';
            },

            clearChatRecords() {
                var currentUserName = this.currentUserName;
                if (currentUserName == null || currentUserName == '') {
                    alert('请先登录');
                    return;
                }
                if (!confirm('确认清空当前用户聊天记录？')) {
                    return;
                }
                doctorApi.deleteRecords().then((result) => {
                    this.chatList = [];
                }).catch((err) => {
                    alert('清空失败，请稍后重试');
                });
            },

            getChatRecords() {
                var me = this;
                doctorApi.getRecords().then((result) => {
                    console.log(result);
                    this.chatList = result;

                    me.scrollToBottom();
                }).catch((err) => {
                    
                });;
            },

            handleKeyDown(event) {
                if (event.key === 'Enter') {    
                    this.doChat();
                }
            },

            doChat() {
                var currentUserName = this.currentUserName;

                const userInput = document.getElementById('user-input').value;
                var pendingMsg = userInput.trim();
                if (pendingMsg === '') return;

                if (currentUserName == null || currentUserName == '') {
                    alert('请先登录');
                    return;
                }

                // 发送消息到后端
                var singleChat = {
                    message: pendingMsg
                };

                doctorApi.doChat(singleChat);

                var newUserContent = {
                        content: pendingMsg,
                        userName: currentUserName,
                        chatType: 'user',
                    }
                this.chatList.push(newUserContent);

                document.getElementById('user-input').value = '';
                this.scrollToBottom();
            },

            generateRandomId(length) {
                const characters = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';
                let result = '';
                const charactersLength = characters.length;
                for (let i = 0; i < length; i++) {
                    result += characters.charAt(Math.floor(Math.random() * charactersLength));
                }
                return result;
            },

            scrollToBottom() {
                this.$nextTick(function () {
                    const chatMessages = document.getElementById('chat-messages');
                    if (!chatMessages) {
                        return;
                    }
                    chatMessages.scrollTop = chatMessages.scrollHeight;
                });
            }
        }
	});

</script>
