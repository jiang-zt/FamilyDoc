<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 家庭医生</title>
    <link rel="stylesheet" href="../../css/doctor/doctor.css">
    <style>
        .chat-failed { color: #e74c3c; }
    </style>
</head>
<body>
    <div class="chat-container" id="doctorPage">
        <div class="chat-header">
            AI 家庭医生 <block v-if="currentUserName != null">正在和<strong style="color: rgb(4, 6, 6);">{{currentUserName}}</strong>沟通中</block>
            <div class="user-input-container" v-if="currentUserName == null">
                <input type="text" id="login-username" placeholder="用户名" class="user-input-field"/>
                <input type="password" id="login-password" placeholder="密码" class="user-input-field"/>
                <button class="submit-button" @click="doLogin()">登录</button>
                <button class="submit-button" @click="doRegister()">注册</button>
                <div class="login-error" v-if="loginError">{{loginError}}</div>
            </div>
            <div class="user-input-container" v-else>
                <button class="submit-button" @click="doLogout()">退出登录</button>
            </div>
        </div>
        <div class="chat-messages" id="chat-messages">
            
            <block v-for="(item, index) in chatList">
                <div class="message user" v-if="item.chatType === 'user'">
                    <div class="text">{{ item.content }}</div>
                    <div class="user-avatar">我</div>
                </div>
               <div class="message bot" v-else>
                    <div class="avatar">
                        <img class="avatar-img" src="../../img/doctor-avatar.png" alt="doctor">
                    </div>
                    <div class="text" :class="{ 'chat-failed': item.failed }">
                        <div v-html="item.content"></div>
                        <div v-if="item.statusText">{{ item.statusText }}</div>
                    </div>
                </div>
            </block>

        </div>
        <div class="chat-input">
            <input type="text" id="user-input" value="" placeholder="请输入内容..." @keydown="handleKeyDown($event)">
            <button id="btn-chat" :disabled="isGenerating" @click="doChat()">发送</button>
            <button v-if="isGenerating" @click="cancelChat()">停止</button>
            <button id="btn-clear" :disabled="isGenerating" @click="clearChatRecords()">清空记录</button>
        </div>
    </div>

</body>

<script src="../../libs/vue.min.js"></script>
<script src="../../libs/axios.min.js"></script>
<script src="../../libs/jquery-3.4.1.min.js"></script>
<script src="../../libs/js.cookie.min.js"></script>
<script src="../../js/app.js"></script>

<script src="../../libs/marked.min.js"></script>

<script src="../../js/cookieUtils.js"></script>
<script src="../../js/request.js"></script>
<script src="../../js/apis/admin/authApi.js"></script>
<script src="../../js/chatStream.js"></script>
<script src="../../js/apis/admin/doctorApi.js"></script>

<script>

	var doctorPage = new Vue({
		el: "#doctorPage",
		components: {
			// 'my-component': httpVueLoader('my-component.vue')
        },
		data() {
			return {
                currentUserName: null,
                chatList: [],
                loginError: null,
                streamController: null,
                beforeUnloadHandler: null,
                isGenerating: false,
			}
		},
		created() { 
            this.beforeUnloadHandler = () => {
                this.cancelChat();
            };
		},
		mounted() {
            this.tryAutoLogin();
            this.scrollToBottom();
            window.addEventListener('beforeunload', this.beforeUnloadHandler);
        },
        beforeDestroy() {
            this.cancelChat();
            if (this.beforeUnloadHandler) {
                window.removeEventListener('beforeunload', this.beforeUnloadHandler);
            }
        },
		watch: {
		},
		methods: {
            cancelChat() {
                if (this.streamController) this.streamController.abort();
            },

            tryAutoLogin() {
                var userInfo = cookieUtils.getUserInfo();
                var token = cookieUtils.getToken();
                if (!userInfo || !token) {
                    return;
                }

                authApi.me().then((result) => {
                    this.currentUserName = result.username;
                    this.getChatRecords();
                }).catch((err) => {
                    this.cancelChat();
                    cookieUtils.removeUserInfo();
                    cookieUtils.removeToken();
                });
            },

            doLogin() {
                this.loginError = null;
                const username = document.getElementById('login-username').value;
                const password = document.getElementById('login-password').value;
                if (username.trim() === '' || password.trim() === '') {
                    this.loginError = '请输入用户名和密码';
                    return;
                }

                authApi.login({username: username.trim(), password: password.trim()}).then((result) => {
                    this.cancelChat();
                    cookieUtils.setToken(result.token);
                    cookieUtils.setUserInfo(result.user);
                    this.currentUserName = result.user.username;
                    this.getChatRecords();
                }).catch((err) => {
                    this.loginError = '登录失败，请检查用户名或密码';
                });
            },

            doRegister() {
                this.loginError = null;
                const username = document.getElementById('login-username').value;
                const password = document.getElementById('login-password').value;
                if (username.trim() === '' || password.trim() === '') {
                    this.loginError = '请输入用户名和密码';
                    return;
                }
                authApi.register({username: username.trim(), password: password.trim()}).then((result) => {
                    this.cancelChat();
                    cookieUtils.setToken(result.token);
                    cookieUtils.setUserInfo(result.user);
                    this.currentUserName = result.user.username;
                    this.getChatRecords();
                }).catch((err) => {
                    this.loginError = '注册失败，用户名可能已存在';
                });
            },

            doLogout() {
                this.cancelChat();
                cookieUtils.removeUserInfo();
                cookieUtils.removeToken();
                this.currentUserName = null;
                this.chatList = [];
                window.location.href = '/pages/entry.html';
            },

            clearChatRecords() {
                var currentUserName = this.currentUserName;
                if (currentUserName == null || currentUserName == '') {
                    alert('请先登录');
                    return;
                }
                if (this.isGenerating) {
                    alert('正在生成中，不能清空记录');
                    return;
                }
                if (!confirm('确认清空当前用户聊天记录？')) {
                    return;
                }
                doctorApi.deleteRecords().then((result) => {
                    this.chatList = [];
                }).catch((err) => {
                    alert('清空失败，请稍后重试');
                });
            },

            getChatRecords() {
                var me = this;
                doctorApi.getRecords().then((result) => {
                    console.log(result);
                    this.chatList = result;

                    me.scrollToBottom();
                }).catch((err) => {
                    
                });;
            },

            handleKeyDown(event) {
                if (event.key === 'Enter') {
                    if (this.isGenerating) {
                        return;
                    }
                    this.doChat();
                }
            },

            async doChat() {
                if (this.isGenerating) return;
                const input = document.getElementById('user-input');
                const message = input.value.trim();
                if (!message) return;
                if (!this.currentUserName) { alert('请先登录'); return; }
                this.isGenerating = true;
                const controller = new AbortController();
                this.streamController = controller;
                const bot = { content: '', chatType: 'bot', failed: false, statusText: '' };
                this.chatList.push({ content: message, chatType: 'user', userName: this.currentUserName });
                this.chatList.push(bot);
                input.value = '';
                this.scrollToBottom();
                let terminal = false;
                try {
                    await doctorApi.doChat({ message }, event => {
                        if (event.event === 'delta') bot.content += event.data.text;
                        if (event.event === 'done') terminal = true;
                        if (event.event === 'failed') {
                            terminal = true;
                            bot.failed = true;
                            bot.statusText = event.data.message;
                        }
                        this.scrollToBottom();
                    }, controller.signal);
                } catch (error) {
                    if (!terminal) {
                        bot.failed = true;
                        bot.statusText = error.name === 'AbortError'
                            ? '已停止生成，结果未确认，可刷新查看记录'
                            : (error.message || '连接中断，结果未确认');
                    }
                } finally {
                    if (this.streamController === controller) {
                        this.streamController = null;
                        this.isGenerating = false;
                    }
                    this.scrollToBottom();
                }
            },

            scrollToBottom() {
                this.$nextTick(function () {
                    const chatMessages = document.getElementById('chat-messages');
                    if (!chatMessages) {
                        return;
                    }
                    chatMessages.scrollTop = chatMessages.scrollHeight;
                });
            }
        }
	});

</script>
