spring:
  application:
    name: deepseek-doctor   # 定义当前项目的应用名称
  profiles:
    active: dev
#  ai:
#    ollama:
#      base-url: http://127.0.0.1:11434
#      chat:
#        model: my-doctor:1.0.1.Release

# MyBatisPlus 的配置
mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl
  global-config:
    db-config:
      id-type: assign_id
      update-strategy: not_empty
  mapper-locations: classpath*:/mappers/*.xml

auth:
  jwt:
    secret: change-this-secret-in-prod
    expire-minutes: 120
  admin:
    username: admin

dashscope:
  base-url: ${DASHSCOPE_BASE_URL:https://dashscope.aliyuncs.com/api/v1}
  api-key: ${DASHSCOPE_API_KEY:}
  model: ${DASHSCOPE_MODEL:qwen3-235b-a22b}
  temperature: ${DASHSCOPE_TEMPERATURE:0.2}
  mock:
    enabled: ${DASHSCOPE_MOCK_ENABLED:false}
    response: ${DASHSCOPE_MOCK_RESPONSE:这是测试模式下的固定回复。}
    first-token-delay-ms: ${DASHSCOPE_MOCK_FIRST_TOKEN_DELAY_MS:80}
    chunk-delay-ms: ${DASHSCOPE_MOCK_CHUNK_DELAY_MS:40}
    chunk-size: ${DASHSCOPE_MOCK_CHUNK_SIZE:6}
