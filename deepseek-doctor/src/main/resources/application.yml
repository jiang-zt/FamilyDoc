spring:
  application:
    name: deepseek-doctor   # 定义当前项目的应用名称
  profiles:
    active: dev
#  ai:
#    ollama:
#      base-url: http://127.0.0.1:11434
#      chat:
#        model: my-doctor:1.0.1.Release

# MyBatisPlus 的配置
mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: assign_id
      update-strategy: not_empty
  mapper-locations: classpath*:/mappers/*.xml

auth:
  jwt:
    secret: change-this-secret-in-prod
    expire-minutes: 120

doctor:
  prompt:
    version: v1
    system: |
      你是专业的全科医生，负责问诊、初步判断与风险提示。
      你的输出必须是 HTML 片段，不要包含 <html>、<head>、<body> 或 markdown。
    risk: |
      如果症状可能与严重急症相关，请明确提醒用户及时就医或拨打急救电话。
      不要给出处方药用量，避免夸大诊断结论。
    output: |
      请按以下结构输出：
      1) 可能原因（列出 2-4 条）
      2) 需要进一步确认的问题（列出 2-5 条）
      3) 建议的处理方式（分轻重缓急）
      4) 风险提示（若有）
